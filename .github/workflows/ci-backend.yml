name: Backend CI - Docker Build

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - docker/backend/**
      - .github/workflows/ci-backend.yml

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: |
          docker build \
            -f docker/backend/Dockerfile \
            -t expense-tracker-backend:ci .
